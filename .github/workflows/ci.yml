name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # One run per branch: a force-push mid-review shouldn't leave two runs racing to report. The
  # release job opts out of this group — see its own `concurrency`, since cancelling a publish is
  # not the same kind of harmless as cancelling a test run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 24, not 22: the server runs its TypeScript directly, and Node 24 strips types with no flag.
  # Everything else the pipeline needs is pinned in package-lock.json; this only fixes the runtime.
  NODE_VERSION: '24'

# The pipeline is a chain, cheapest gate first, so a failure costs the least it can and the reason
# is never buried under an unrelated one:
#
#     quality ┐
#     commits ├─→ test ─→ build ─→ release   (release: push to main only)
#     branch  ┘
#
# The first three need no bundle and report in under a minute; `test` runs the suite; `build`
# proves the client still bundles; `release` versions, tags and publishes. Nothing downstream
# starts until everything upstream is green.
jobs:
  # ---------------------------------------------------------------------------------------------
  # Stage 1 — three checks that need no build, so they run together and report almost immediately.
  # ---------------------------------------------------------------------------------------------

  quality:
    name: Format & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Prettier owns layout and TypeScript owns everything else. There is deliberately no linter
      # in between: this config reports zero violations today, so anything either tool prints is
      # new. Add one when it earns its keep, not before.
      - name: Check formatting
        run: npx prettier --check .

      # `erasableSyntaxOnly` is on in tsconfig, so this also guards the one constraint Node's
      # type stripping imposes on `server/` and `shared/`: no enums, no namespaces, no parameter
      # properties. Without it the server would only fail at the moment someone runs it.
      - name: Typecheck
        run: npx tsc --noEmit

  # Conventional Commits are load-bearing here, not a style preference: merges into `main` are
  # squash-only, so the PR title becomes the single commit on `main` and is the only thing
  # `@semantic-release/commit-analyzer` reads to decide the next version. A `chore:` title
  # releases nothing; a non-conventional one releases nothing and says why nowhere.
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint walks the range base..HEAD, which needs the history, not a shallow tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The one that decides the release. Passed through the environment rather than interpolated
      # into the script: a PR title is untrusted input, and `${{ }}` inside `run:` is substituted
      # before the shell ever sees it, so a title containing backticks would execute.
      - name: Lint the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          echo "Title: $PR_TITLE"
          printf '%s' "$PR_TITLE" | npx --no-install commitlint

      # Advisory in effect but worth failing on: these are the messages that are still cheap to
      # reword, and a branch whose commits are conventional produces a usable title by default.
      - name: Lint the commits in this PR
        run: |
          npx --no-install commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }}

  # Cosmetic for the release itself — nothing reads a branch name — but it keeps the branch and the
  # commit type it will produce in step, so the PR title is usually already correct.
  branch-name:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch is named type/slug
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # The two long-lived branches are exempt, and `develop` is not a hypothetical: a
          # develop → main PR is how a release ships, and it would fail every other rule here.
          if [[ "$BRANCH" == "main" || "$BRANCH" == "develop" ]]; then
            echo "ok: $BRANCH (long-lived branch)"
            exit 0
          fi
          # Same vocabulary as commitlint's types — see commitlint.config.js.
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[a-z0-9._/-]+$'
          if [[ "$BRANCH" =~ $pattern ]]; then
            echo "ok: $BRANCH"
            exit 0
          fi
          echo "::error::Branch '$BRANCH' is not named <type>/<slug>."
          echo "Allowed types: build chore ci docs feat fix perf refactor revert style test"
          echo "The slug is lowercase letters, digits, dots, dashes, underscores or slashes."
          echo "Example: feat/organization-board"
          exit 1

  # ---------------------------------------------------------------------------------------------
  # Stage 2 — the tests, once the cheap checks agree there is something worth running.
  # ---------------------------------------------------------------------------------------------

  test:
    name: Tests
    needs: [quality, commits, branch-name]
    # `commits` and `branch-name` are skipped on `push`, and a skipped need would otherwise skip
    # this job too. `!failure() && !cancelled()` treats skipped as fine and blocks on red.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Includes the golden-file suite: every file in `shared/__fixtures__/vault` must decode and
      # re-encode byte for byte. That is the gate on the vault format, and it is why a save in the
      # running app produces a diff of only what changed.
      - name: Run tests
        run: npx vitest run

  # ---------------------------------------------------------------------------------------------
  # Stage 3 — prove the client still bundles. Types passing is not the same as Vite resolving every
  # import, and this is the cheapest thing that asks the second question.
  # ---------------------------------------------------------------------------------------------

  build:
    name: Build the client
    needs: test
    # Same reason `test` needs this: `build` is downstream of `commits` and `branch-name`, which
    # are skipped on `push` — and GitHub's default `success()` treats a skipped job as
    # unsuccessful, which would silently skip this (and therefore release) on every push.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npx vite build

  # ---------------------------------------------------------------------------------------------
  # Stage 4 — version, tag and publish. Push to main only.
  #
  # No artifact is attached: the app is source that runs with `npm ci && npm start`, so a release
  # is its tag and its notes, plus GitHub's own source archives.
  # ---------------------------------------------------------------------------------------------

  release:
    name: Release
    needs: build
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Deliberately not the workflow's cancelling group. semantic-release pushes the tag *before*
    # calling its publish plugins and cannot roll back, so a cancel in that window leaves a tag on
    # `main` with no release and no commits left for the next run to analyze.
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads every tag and every commit since the last one.
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release
