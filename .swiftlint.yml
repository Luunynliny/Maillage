# SwiftLint owns *semantics*; `swift format` (see `.swift-format`) owns *layout*.
#
# The split is deliberate and the two tools genuinely disagree, so every layout rule below is
# disabled rather than tuned: `swift format` adds trailing commas to multiline literals that
# SwiftLint's `trailing_comma` then removes, and it puts a lone `{` on its own line after a
# wrapped signature, which `opening_brace` calls a violation. With both enabled, `make format`
# and `make lint` would each undo the other's work forever.

included:
  - Sources
  - Tests

excluded:
  - .build
  - maillage.xcodeproj

disabled_rules:
  # Layout — `swift format` decides all of these.
  - trailing_comma
  - opening_brace
  - line_length
  - statement_position
  - switch_case_alignment
  - vertical_parameter_alignment
  - closure_parameter_position
  - multiline_arguments
  - trailing_closure

  # `EditorSheet(title:…:onConfirm:onCancel:) { content }` is the shape all four editor sheets
  # are built on: the chrome is passed as arguments and the form body is the trailing closure,
  # which is how a caller reads as SwiftUI rather than as a function call. Satisfying this rule
  # would mean `content:` labels on four sheets to no benefit.
  - multiple_closures_with_trailing_closure

  # `SwiftUI` bodies are long by nature: a `View` is one expression, and splitting a pane's
  # body into private subviews is already the pattern here (`CenterPaneHeader`, `PillCloud`).
  # A line budget on top of that measures the framework, not the code.
  - type_body_length
  - file_length

  # A doc comment on a `// MARK:` section or a `let` at file scope is intentional in
  # `GraphGeometry.swift`, where the file header explains the geometry the whole file shares.
  - orphaned_doc_comment

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - fallthrough
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - yoda_condition

# `to:` is the frontmatter key on `Relation` and `ProjectMembership` — it is written to disk and
# read by humans editing the vault, so the two-letter name is load-bearing. `xs`/`xl` are the
# spacing scale in `Theme`, and `dx`/`dy` are the conventional names for a vector's components
# in `GraphGeometry`. A minimum length of 3 would rename all of them for the worse.
identifier_name:
  min_length:
    warning: 1
    error: 1
  excluded:
    - id

# A tuple of three is `(person:role:)` and `(organization:people:)` in `VaultStore` — a derived
# pair with a label, deliberately not a stored type, since nothing persists it.
large_tuple:
  warning: 3
  error: 4

nesting:
  type_level: 2

function_body_length:
  warning: 80
  error: 120

# `VaultWriter.rename` is the outlier at 20: renaming has to rewrite the entity itself plus
# every inbound reference, which is three entity kinds crossed with relations, employer links
# and project memberships. The branches are a flat sequence of independent rewrites, not nested
# logic, and splitting them into helpers would scatter the one invariant they exist to uphold —
# that no reference to the old id survives.
cyclomatic_complexity:
  warning: 22
  error: 30

reporter: "github-actions-logging"
